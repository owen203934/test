<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNOWL — Relational Camera Stabilized</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#111214;
    --text:#e7e8ea;
    --muted:#8d9197;
    --faint:#5d6269;
    --line:#2a2d31;
    --soft:#181a1d;
    --inspect:#f3f4f5;
    --accent:#aeb8c4;
    --lane-w:356px;
    --pitch:46px;
    --camera-ms:360ms;
  }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); }
  body { font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; }
  button,input { font:inherit; }
  button { -webkit-tap-highlight-color:transparent; }

  #app { position:relative; width:100%; height:100%; overflow:hidden; }
  .topline {
    position:fixed; top:19px; left:22px; right:22px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; pointer-events:none;
  }
  .mark { color:#777c83; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .dev-toggle {
    pointer-events:auto; border:0; background:transparent; color:#73787f; padding:7px 9px;
    border-radius:7px; cursor:pointer; font-size:11px; letter-spacing:.08em;
  }
  .dev-toggle:hover,.dev-toggle[aria-expanded="true"] { color:#d6d8dc; background:#1a1c1f; }

  #workspace { position:absolute; inset:0; overflow:hidden; }
  #camera { position:absolute; inset:0; }
  .lane {
    position:absolute; top:clamp(150px,23vh,230px); left:0; width:var(--lane-w);
    transform:translate3d(var(--lane-x),0,0); transition:transform var(--camera-ms) cubic-bezier(.22,.72,.24,1),opacity 180ms ease;
    will-change:transform; opacity:1;
  }
  .lane.is-hidden { opacity:0; pointer-events:none; }
  .lane.is-context { opacity:.76; }
  .lane.is-related { opacity:.86; }
  .lane.is-active { opacity:1; }
  .lane-surface { position:relative; width:100%; will-change:transform,opacity; }
  .lane-head {
    height:25px; color:#676c73; font-size:11px; line-height:18px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; transition:color 140ms ease;
  }
  .lane.is-active .lane-head { color:#858a91; }
  .lane-window {
    position:relative; height:calc(var(--visible) * var(--pitch)); overflow:hidden;
    contain:layout paint; isolation:isolate;
  }
  .lane-window::before,.lane-window::after {
    content:""; position:absolute; z-index:8; left:0; right:0; height:13px; pointer-events:none;
  }
  .lane-window::before { top:0; background:linear-gradient(to bottom,var(--bg),transparent); }
  .lane-window::after { bottom:0; background:linear-gradient(to top,var(--bg),transparent); }
  .rows { position:absolute; inset:0; transform:translate3d(0,var(--flow-y,0px),0); will-change:transform; }
  .item {
    position:absolute; left:0; top:calc(var(--slot) * var(--pitch)); width:100%; height:var(--pitch);
    display:flex; align-items:center; padding:0 12px 0 0; color:#dadddf; font-size:16px;
    line-height:1.45; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:default; user-select:none; will-change:transform,opacity,background-color;
    border-radius:6px; transition:color 90ms ease,background-color 90ms ease,transform 90ms ease;
  }
  .lane:not(.is-active) .item { color:#b8bbc0; }
  .lane.is-active .item:hover { color:#eceef0; }
  .item.is-inspected {
    color:var(--inspect); background:linear-gradient(90deg,rgba(255,255,255,.055),rgba(255,255,255,0) 84%);
    transform:translateX(5px);
  }
  .item.has-related::after {
    content:""; width:4px; height:4px; margin-left:auto; border-radius:50%; background:#626870; opacity:.72;
  }
  .item.outgoing { pointer-events:none; z-index:5; }
  .inspection {
    position:absolute; z-index:12; left:6px; top:calc((var(--slot) + 1) * var(--pitch) - 4px);
    display:flex; align-items:center; gap:3px; min-height:28px; max-width:calc(100% - 12px); padding:3px 5px;
    background:rgba(17,18,20,.95); border-radius:7px; box-shadow:0 8px 24px rgba(0,0,0,.28);
    animation:inspect-in 100ms ease-out both;
  }
  .inspection.is-above { top:calc(var(--slot) * var(--pitch) - 28px); }
  @keyframes inspect-in { from{opacity:0;transform:translateY(-2px)} to{opacity:1;transform:translateY(0)} }
  .inspect-action {
    appearance:none; border:0; background:transparent; color:#9da2a9; font-size:10px; letter-spacing:.035em;
    flex:0 0 auto; padding:5px 6px; border-radius:5px; cursor:pointer;
  }
  .inspect-action:hover,.inspect-action:focus-visible { color:#eef0f2; background:#24272b; outline:0; }
  .inspect-note { min-width:0; overflow:hidden; text-overflow:ellipsis; color:#6f747b; font-size:10px; margin-left:4px; padding-right:3px; white-space:nowrap; }

  .hint {
    position:fixed; left:22px; bottom:20px; z-index:20; max-width:420px; color:#696e75;
    font-size:11px; line-height:1.6; pointer-events:none;
  }
  #phase-chip {
    position:fixed; left:50%; top:24px; z-index:20; transform:translateX(-50%);
    color:#797e85; font-size:10px; letter-spacing:.12em; opacity:0; transition:opacity 100ms ease;
  }
  #phase-chip.show { opacity:1; }
  #act-feedback {
    position:fixed; left:50%; bottom:38px; z-index:40; transform:translate(-50%,6px);
    color:#aeb2b8; background:#1b1d20; border:1px solid #2b2e33; border-radius:7px;
    padding:8px 11px; font-size:11px; opacity:0; pointer-events:none; transition:opacity 120ms ease,transform 120ms ease;
  }
  #act-feedback.show { opacity:1; transform:translate(-50%,0); }

  #dev-panel {
    position:fixed; z-index:60; top:58px; right:18px; width:282px; max-height:calc(100vh - 78px);
    overflow:auto; padding:12px; background:rgba(20,22,24,.97); border:1px solid #2d3035;
    border-radius:9px; box-shadow:0 18px 50px rgba(0,0,0,.38); display:none;
  }
  #dev-panel.open { display:block; }
  .dev-grid { display:grid; grid-template-columns:1fr 78px; gap:8px 10px; align-items:center; }
  .dev-grid label { color:#9499a0; font-size:10px; line-height:1.25; }
  .dev-grid input {
    width:78px; border:1px solid #34383d; background:#151719; color:#d8dade; border-radius:5px;
    padding:4px 5px; font-size:10px;
  }
  .dev-actions { display:flex; gap:6px; margin-top:12px; }
  .dev-btn { border:1px solid #35383d; background:#191b1e; color:#aeb2b8; padding:6px 9px; border-radius:6px; font-size:10px; cursor:pointer; }
  .dev-btn:hover,.dev-btn.active { color:#eff0f2; border-color:#555a61; }
  #debug {
    display:none; margin-top:11px; padding-top:10px; border-top:1px solid #2b2e33;
    color:#858a91; font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  #debug.open { display:block; }

  @media (max-width:760px) {
    :root { --lane-w:min(78vw,340px); }
    .hint { max-width:72vw; }
    #dev-panel { width:min(282px,calc(100vw - 28px)); }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topline">
    <div class="mark">KNOWL / relational camera / stabilized</div>
    <button id="dev-toggle" class="dev-toggle" type="button" aria-expanded="false">DEV</button>
  </div>
  <div id="workspace"><div id="camera"></div></div>
  <div id="phase-chip"></div>
  <div class="hint">Y moves sibling exposure. Brief rest inspects. X reveals and hands off authored relations. Return through the left context.</div>
  <div id="act-feedback"></div>
  <aside id="dev-panel" aria-label="Developer tuning panel">
    <div id="dev-grid" class="dev-grid"></div>
    <div class="dev-actions">
      <button id="reset" class="dev-btn" type="button">Reset</button>
      <button id="debug-toggle" class="dev-btn" type="button">Debug</button>
    </div>
    <div id="debug"></div>
  </aside>
</div>
<script>
(() => {
  'use strict';

  const $ = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const sleep = ms => new Promise(resolve => setTimeout(resolve,ms));
  const effectiveVerticalMotion = (accumulator,deadZone) => Math.sign(accumulator)*Math.max(0,Math.abs(accumulator)-deadZone);
  const coalescedExposureTarget = (target,direction,maxStart) => clamp(target+direction,0,maxStart);
  function cameraGap(viewportWidth,width,homePosition,enterThreshold) {
    const homeLeft=viewportWidth*homePosition/100-width/2;
    const nominalGap=Math.max(310,Math.min(430,viewportWidth*.31));
    const entryRoom=enterThreshold+20;
    return Math.max(width*.7,Math.min(nominalGap,viewportWidth-homeLeft-entryRoom,homeLeft+width-entryRoom));
  }

  // Authored, immutable relations. Camera activity never writes into this graph.
  const DEFAULT_AUTHORED = Object.freeze([
    {id:'root',text:'Tests',parentId:null},
    ...Array.from({length:10},(_,i)=>({id:`t${i+1}`,text:`Test ${i+1}`,parentId:'root'})),
    {id:'t4-1',text:'Test 4.1',parentId:'t4'},
    {id:'t4-2',text:'Test 4.2',parentId:'t4'},
    {id:'t4-3',text:'Test 4.3',parentId:'t4'},
    {id:'t4-4',text:'Test 4.4',parentId:'t4'},
    {id:'t4-1-1',text:'Test 4.1.1',parentId:'t4-1'},
    {id:'t4-1-2',text:'Test 4.1.2',parentId:'t4-1'},
    {id:'t4-1-3',text:'Test 4.1.3',parentId:'t4-1'},
    {id:'t4-1-1-a',text:'Test 4.1.1.a',parentId:'t4-1-1'},
    {id:'t4-1-1-b',text:'Test 4.1.1.b',parentId:'t4-1-1'},
    {id:'t4-1-1-x',text:'Test 4.1.1.x',parentId:'t4-1-1'},
    {id:'t4-1-1-y',text:'Test 4.1.1.y',parentId:'t4-1-1'},
    {id:'t4-2-1',text:'Test 4.2.1',parentId:'t4-2'},
    {id:'t7-1',text:'Test 7.1',parentId:'t7'},
    {id:'t7-2',text:'Test 7.2',parentId:'t7'},
    {id:'t7-3',text:'Test 7.3',parentId:'t7'}
  ]);
  // Explicit test-only fixture: opt in with ?fixture=overflow. Default authored data is unchanged.
  const OVERFLOW_FIXTURE = Object.freeze([
    ...DEFAULT_AUTHORED,
    ...Array.from({length:9},(_,i)=>({id:`t4-over-${i+1}`,text:`Overflow ${i+1}`,parentId:'t4'})),
    {id:'t4-over-1-a',text:'Overflow 1.a',parentId:'t4-over-1'},
    {id:'t4-over-1-b',text:'Overflow 1.b',parentId:'t4-over-1'},
    {id:'t4-over-1-a-i',text:'Overflow 1.a.i',parentId:'t4-over-1-a'}
  ]);
  const fixtureName=new URLSearchParams(location.search).get('fixture')==='overflow'?'overflow':'default';
  const AUTHORED=fixtureName==='overflow'?OVERFLOW_FIXTURE:DEFAULT_AUTHORED;
  const byId = new Map(AUTHORED.map(item=>[item.id,item]));
  const childrenOf = parentId => AUTHORED.filter(item=>item.parentId===parentId);

  const defaults = Object.freeze({
    inspectDelay:360,
    inspectTolerance:5,
    verticalGain:.86,
    exposureDuration:230,
    leftExitDistance:155,
    leftEntryDistance:110,
    revealOffset:28,
    laneEnterThreshold:34,
    handoffDelay:150,
    recenterDuration:360,
    homePosition:43,
    depthCloseGrace:420,
    visibleItems:6,
    pointerDeadZone:4,
    overscroll:.34
  });
  let tune = {...defaults};

  const state = {
    activeDepth:0,
    lanes:new Map(),
    activeLaneId:'lane-0',
    inspectTargetId:null,
    inspectLaneDepth:null,
    inspectCandidateId:null,
    inspectCandidate:null,
    revealedLaneId:null,
    handoffTargetLaneId:null,
    handoffCandidate:null,
    phase:'IDLE',
    cameraState:'settled',
    pointer:{x:0,y:0,lastX:0,lastY:0,time:performance.now(),velocity:0,seen:false,sequence:0,inputLaneId:null},
    insideActive:false,
    insideRevealed:false,
    protectedItemId:null,
    inspectTimer:null,
    handoffTimer:null,
    closeTimer:null,
    debug:false,
    raf:null,
    lastAction:null,
    generation:0,
    transitionGeneration:0,
    retainedContexts:new Map(),
    devEvents:[]
  };

  const camera = $('#camera');
  const phaseChip = $('#phase-chip');
  const feedback = $('#act-feedback');

  function makeLane(depth,parentId,sourceId=null) {
    const parent = byId.get(parentId);
    const retained=state.retainedContexts.get(`${depth}:${parentId}`);
    const lane={
      id:`lane-${depth}-${parentId}`,
      depth,parentId,sourceId,
      items:childrenOf(parentId),
      start:retained?.start||0,
      targetStart:retained?.start||0,
      accumulator:0,
      visualOffset:0,
      visualTarget:0,
      lastY:null,
      busy:false,
      renderKey:null,
      transitionGeneration:0,
      animations:new Set(),
      el:null,
      surfaceEl:null,
      windowEl:null,
      rowsEl:null,
      origin:parent ? parent.text : 'Authored relation'
    };
    return lane;
  }

  function init() {
    state.lanes.set(0,makeLane(0,'root'));
    buildTuningPanel();
    syncCamera(true);
    bindEvents();
    debugTick();
    window.__relationalCamera = {
      state,tune,AUTHORED,fixtureName,
      snapshot:()=>debugSnapshot(),
      events:()=>state.devEvents.slice(),
      inspect:(id)=>forceInspect(id),
      handoff:(depth)=>beginHandoff(depth),
      feed:(dy)=>{ const lane=state.lanes.get(state.activeDepth); if(lane) feedVertical(lane,dy,'test'); },
      reset
    };
  }

  function devLog(type,data={}) {
    state.devEvents.push({at:Math.round(performance.now()),type,generation:state.generation,...data});
    if(state.devEvents.length>180) state.devEvents.splice(0,state.devEvents.length-180);
  }

  function isLiveLane(lane) {
    return !!lane && state.lanes.get(lane.depth)===lane && lane.el?.isConnected;
  }

  function rememberLane(lane) {
    state.retainedContexts.set(`${lane.depth}:${lane.parentId}`,{start:lane.start});
  }

  function cancelLaneAnimations(lane,reason) {
    lane.transitionGeneration++;
    for(const animation of lane.animations) animation.cancel();
    lane.animations.clear();
    lane.busy=false;
    lane.targetStart=lane.start;
    lane.accumulator=0;
    lane.visualOffset=0;
    lane.visualTarget=0;
    lane.rowsEl?.style.setProperty('--flow-y','0px');
    devLog('lane-cancel',{laneId:lane.id,reason});
  }

  function removeLane(lane,reason) {
    rememberLane(lane);
    cancelLaneAnimations(lane,reason);
    lane.el?.remove();
    state.lanes.delete(lane.depth);
  }

  function cancelInspectCandidate(reason) {
    clearTimeout(state.inspectTimer);
    state.inspectTimer=null;
    if(state.inspectCandidate) devLog('inspect-cancel',{itemId:state.inspectCandidate.itemId,reason});
    state.inspectCandidate=null;
    state.inspectCandidateId=null;
  }

  function cancelHandoffCandidate(reason) {
    clearTimeout(state.handoffTimer);
    state.handoffTimer=null;
    if(state.handoffCandidate) devLog('handoff-cancel',{laneId:state.handoffCandidate.laneId,reason});
    state.handoffCandidate=null;
    state.handoffTargetLaneId=null;
    if(state.phase==='ENTER') state.phase='IDLE';
  }

  function releasePointerLane(reason) {
    if(!state.pointer.inputLaneId) return;
    const lane=[...state.lanes.values()].find(candidate=>candidate.id===state.pointer.inputLaneId);
    if(lane) {
      lane.accumulator=0;
      lane.visualTarget=0;
      ensureFlowAnimation();
    }
    devLog('pointer-lane-release',{laneId:state.pointer.inputLaneId,reason});
    state.pointer.inputLaneId=null;
  }

  function laneX(depth) {
    const width = laneWidth();
    const homeCenter = innerWidth * tune.homePosition / 100;
    const homeLeft=homeCenter-width/2;
    const gap=cameraGap(innerWidth,width,tune.homePosition,tune.laneEnterThreshold);
    return homeLeft + (depth-state.activeDepth)*gap;
  }
  function laneWidth() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lane-w')) || 356;
  }
  function visibleDepths() {
    return new Set([state.activeDepth-1,state.activeDepth,state.activeDepth+1]);
  }
  function roleFor(depth) {
    if(depth===state.activeDepth) return 'active';
    if(depth===state.activeDepth-1) return 'context';
    if(depth===state.activeDepth+1) return 'related';
    return 'hidden';
  }

  function syncCamera(immediate=false) {
    const visible = visibleDepths();
    for(const lane of state.lanes.values()) {
      if(!lane.el) createLaneDOM(lane);
      const role=roleFor(lane.depth);
      lane.el.className=`lane is-${role}${visible.has(lane.depth)?'':' is-hidden'}`;
      lane.el.dataset.role=role;
      lane.el.style.setProperty('--lane-x',`${laneX(lane.depth)}px`);
      lane.el.style.setProperty('--visible',String(tune.visibleItems));
      lane.el.style.setProperty('--camera-ms',immediate?'0ms':`${tune.recenterDuration}ms`);
      renderRows(lane);
    }
    state.activeLaneId=(state.lanes.get(state.activeDepth)||{}).id||null;
    state.revealedLaneId=(state.lanes.get(state.activeDepth+1)||{}).id||null;
    requestAnimationFrame(()=>{
      for(const lane of state.lanes.values()) if(lane.el) lane.el.style.setProperty('--camera-ms',`${tune.recenterDuration}ms`);
    });
  }

  function createLaneDOM(lane) {
    const el=document.createElement('section');
    el.className='lane';
    el.dataset.depth=String(lane.depth);
    el.dataset.laneId=lane.id;
    el.innerHTML=`<div class="lane-surface"><div class="lane-head">${escapeHTML(lane.origin)}</div><div class="lane-window"><div class="rows"></div></div></div>`;
    lane.el=el;
    lane.surfaceEl=$('.lane-surface',el);
    lane.windowEl=$('.lane-window',el);
    lane.rowsEl=$('.rows',el);
    camera.appendChild(el);
  }

  function renderRows(lane,{force=false}={}) {
    if(!lane.rowsEl) return;
    const count=Math.min(tune.visibleItems,lane.items.length);
    const maxStart=Math.max(0,lane.items.length-count);
    lane.start=clamp(lane.start,0,maxStart);
    lane.targetStart=clamp(lane.targetStart,0,maxStart);
    const slice=lane.items.slice(lane.start,lane.start+count);
    const renderKey=`${lane.start}|${count}|${slice.map(item=>item.id).join(',')}|${state.inspectLaneDepth===lane.depth?state.inspectTargetId||'':''}`;
    if(!force && lane.renderKey===renderKey) {
      lane.rowsEl.style.setProperty('--flow-y',`${lane.visualOffset.toFixed(2)}px`);
      return;
    }
    lane.renderKey=renderKey;
    $$('.inspection',lane.windowEl).forEach(el=>el.remove());
    lane.rowsEl.innerHTML=slice.map((item,slot)=>itemHTML(item,slot,lane.depth)).join('');
    lane.rowsEl.style.setProperty('--flow-y',`${lane.visualOffset.toFixed(2)}px`);
    if(state.inspectLaneDepth===lane.depth && state.inspectTargetId) renderInspection(lane);
  }

  function itemHTML(item,slot,depth) {
    const related=childrenOf(item.id).length>0;
    const inspected=state.inspectLaneDepth===depth && state.inspectTargetId===item.id;
    return `<div class="item${related?' has-related':''}${inspected?' is-inspected':''}" data-item-id="${escapeHTML(item.id)}" data-depth="${depth}" data-slot="${slot}" style="--slot:${slot}"><span>${escapeHTML(item.text)}</span></div>`;
  }

  function renderInspection(lane) {
    const row=$(`.item[data-item-id="${CSS.escape(state.inspectTargetId)}"]`,lane.rowsEl);
    if(!row) return;
    const item=byId.get(state.inspectTargetId);
    const pop=document.createElement('div');
    pop.className='inspection';
    pop.dataset.inspectOwner=item.id;
    pop.style.setProperty('--slot',row.dataset.slot);
    if(Number(row.dataset.slot)>=Math.min(tune.visibleItems,lane.items.length)-1) pop.classList.add('is-above');
    pop.innerHTML=['WHAT?','WHY?','HOW?','TEST','+'].map(action=>`<button class="inspect-action" data-action="${action}" type="button">${action}</button>`).join('')+
      `<span class="inspect-note">${childrenOf(item.id).length?'related material':'local action'}</span>`;
    lane.windowEl.appendChild(pop);
  }

  function clearInspection({keepReveal=false}={}) {
    cancelInspectCandidate('inspection-cleared');
    const depth=state.inspectLaneDepth;
    state.inspectTargetId=null;
    state.inspectLaneDepth=null;
    $$('.inspection').forEach(el=>el.remove());
    $$('.item.is-inspected').forEach(el=>el.classList.remove('is-inspected'));
    if(!keepReveal && depth!==null) scheduleDepthClose(depth+1);
  }

  function scheduleInspect(itemId,depth) {
    if(depth!==state.activeDepth || !itemId || state.cameraState!=='settled') return;
    const lane=state.lanes.get(depth);
    if(!lane || lane.busy) return;
    if(state.inspectCandidate?.itemId===itemId && state.inspectCandidate?.pointerSequence===state.pointer.sequence && state.inspectTimer) return;
    cancelInspectCandidate('candidate-replaced');
    state.inspectCandidateId=itemId;
    const candidate=state.inspectCandidate={
      itemId,depth,laneId:lane.id,parentId:lane.parentId,
      pointerSequence:state.pointer.sequence,generation:state.generation,
      anchor:{x:state.pointer.x,y:state.pointer.y}
    };
    devLog('inspect-candidate',{itemId, laneId:lane.id, pointerSequence:candidate.pointerSequence});
    state.inspectTimer=setTimeout(()=>{
      if(state.inspectCandidate!==candidate) return;
      const currentLane=state.lanes.get(depth);
      const moved=Math.hypot(state.pointer.x-candidate.anchor.x,state.pointer.y-candidate.anchor.y);
      const itemStillVisible=!!currentLane?.rowsEl?.querySelector(`.item[data-item-id="${CSS.escape(itemId)}"]`);
      if(moved>tune.inspectTolerance || state.pointer.sequence!==candidate.pointerSequence ||
         state.generation!==candidate.generation || state.activeDepth!==depth ||
         state.cameraState!=='settled' || currentLane?.id!==candidate.laneId ||
         currentLane?.parentId!==candidate.parentId || !itemStillVisible) {
        cancelInspectCandidate('commit-revalidation');
        return;
      }
      inspectItem(itemId,depth);
    },tune.inspectDelay);
  }

  function inspectItem(itemId,depth) {
    if(depth!==state.activeDepth) return;
    clearTimeout(state.closeTimer);
    state.inspectTargetId=itemId;
    state.inspectLaneDepth=depth;
    state.inspectCandidateId=null;
    state.inspectCandidate=null;
    state.inspectTimer=null;
    devLog('inspect-commit',{itemId,laneId:state.lanes.get(depth)?.id});
    renderRows(state.lanes.get(depth));
    if(childrenOf(itemId).length) revealFrom(depth,itemId);
    else scheduleDepthClose(depth+1);
  }

  function forceInspect(itemId) {
    const item=byId.get(itemId);
    if(!item) return false;
    const lane=state.lanes.get(state.activeDepth);
    if(!lane || item.parentId!==lane.parentId) return false;
    inspectItem(itemId,state.activeDepth);
    return true;
  }

  function revealFrom(sourceDepth,sourceId) {
    const targetDepth=sourceDepth+1;
    const children=childrenOf(sourceId);
    if(!children.length) return;
    clearTimeout(state.closeTimer);
    state.closeTimer=null;
    const existing=state.lanes.get(targetDepth);
    if(existing?.parentId===sourceId) {
      state.revealedLaneId=existing.id;
      syncCamera();
      devLog('reveal-retained',{sourceId,laneId:existing.id});
      return;
    }
    state.generation++;
    cancelHandoffCandidate('branch-replacement');
    for(const [depth,lane] of [...state.lanes]) {
      if(depth>=targetDepth) removeLane(lane,'branch-replacement');
    }
    const lane=makeLane(targetDepth,sourceId,sourceId);
    state.lanes.set(targetDepth,lane);
    state.phase='REVEAL';
    showPhase('REVEAL');
    syncCamera();
    const generation=state.generation;
    const animation=lane.surfaceEl.animate([
      {opacity:0,transform:`translate3d(${tune.revealOffset}px,0,0)`},
      {opacity:1,transform:'translate3d(0,0,0)'}
    ],{duration:180,easing:'cubic-bezier(.2,.7,.25,1)'});
    lane.animations.add(animation);
    animation.finished.catch(()=>{}).finally(()=>lane.animations.delete(animation));
    devLog('reveal-start',{sourceId,laneId:lane.id,transitionGeneration:state.transitionGeneration});
    setTimeout(()=>{
      if(state.generation===generation && state.phase==='REVEAL') state.phase='IDLE';
    },190);
  }

  function scheduleDepthClose(depth) {
    clearTimeout(state.closeTimer);
    if(depth<=state.activeDepth) return;
    const generation=state.generation;
    const sourceLaneId=state.lanes.get(depth)?.id||null;
    state.closeTimer=setTimeout(()=>{
      if(state.generation!==generation || state.insideRevealed || state.handoffCandidate) return;
      if(sourceLaneId && state.lanes.get(depth)?.id!==sourceLaneId) return;
      for(const [d,lane] of [...state.lanes]) {
        if(d>=depth) removeLane(lane,'depth-close');
      }
      state.revealedLaneId=(state.lanes.get(state.activeDepth+1)||{}).id||null;
      state.closeTimer=null;
      devLog('depth-close',{depth,sourceLaneId});
    },tune.depthCloseGrace);
  }

  async function beginHandoff(targetDepth,candidate=state.handoffCandidate) {
    if(state.cameraState!=='settled' || targetDepth<0 || !state.lanes.has(targetDepth) || Math.abs(targetDepth-state.activeDepth)!==1) return false;
    if(candidate && (candidate.targetDepth!==targetDepth || candidate.laneId!==state.lanes.get(targetDepth)?.id)) return false;
    cancelHandoffCandidate('committed');
    clearTimeout(state.closeTimer);
    state.closeTimer=null;
    cancelInspectCandidate('handoff');
    const generation=state.generation;
    const transitionGeneration=++state.transitionGeneration;
    const oldDepth=state.activeDepth;
    const target=state.lanes.get(targetDepth);
    state.phase='HANDOFF';
    state.cameraState='handoff';
    state.handoffTargetLaneId=target.id;
    state.protectedItemId=candidate?.itemId||target.items[target.start]?.id||null;
    devLog('handoff-start',{fromDepth:oldDepth,targetDepth,laneId:target.id,actionTargetId:state.protectedItemId,transitionGeneration});
    showPhase('HANDOFF');
    clearInspection({keepReveal:true});

    state.activeDepth=targetDepth;
    state.activeLaneId=target.id;
    state.pointer.inputLaneId=target.id;
    state.insideActive=true;
    state.insideRevealed=false;
    await sleep(34);
    if(state.generation!==generation || state.lanes.get(targetDepth)!==target) return false;
    state.phase='RECENTER';
    state.cameraState='recentering';
    showPhase('RECENTER');
    syncCamera();
    await sleep(tune.recenterDuration+24);
    if(state.generation!==generation || state.lanes.get(targetDepth)!==target) return false;
    state.phase='IDLE';
    state.cameraState='settled';
    state.handoffTargetLaneId=null;
    state.protectedItemId=null;
    const laneNow=state.lanes.get(state.activeDepth);
    if(laneNow) {
      laneNow.lastY=state.pointer.y;
      // Camera motion may move content under a stationary pointer. It cannot create a new target.
      state.insideActive=false;
    }
    // Returning leaves the former child as the right-hand authored relation.
    if(targetDepth<oldDepth) syncCamera();
    devLog('handoff-settled',{activeDepth:state.activeDepth,laneId:target.id,transitionGeneration});
    return true;
  }

  function considerHandoff(hit) {
    const targetDepth=hit ? hit.depth : null;
    const adjacent=targetDepth!==null && Math.abs(targetDepth-state.activeDepth)===1;
    if(!adjacent || state.cameraState!=='settled') {
      cancelHandoffCandidate(!adjacent?'not-adjacent':'camera-moving');
      return;
    }
    const lane=state.lanes.get(targetDepth);
    if(!lane) { cancelHandoffCandidate('lane-missing'); return; }
    const rect=lane.windowEl.getBoundingClientRect();
    const penetration=targetDepth>state.activeDepth ? state.pointer.x-rect.left : rect.right-state.pointer.x;
    if(penetration<tune.laneEnterThreshold) {
      cancelHandoffCandidate('below-threshold');
      return;
    }
    clearTimeout(state.closeTimer);
    state.closeTimer=null;
    const current=state.handoffCandidate;
    if(current && (current.laneId!==lane.id || current.itemId!==hit.itemId || current.sourceActiveLaneId!==state.activeLaneId)) {
      cancelHandoffCandidate('candidate-replaced');
    }
    state.phase='ENTER';
    state.handoffTargetLaneId=lane.id;
    showPhase('ENTER');
    if(state.handoffTimer) return;
    const candidate=state.handoffCandidate={
      laneId:lane.id,targetDepth,itemId:hit.itemId,parentId:lane.parentId,sourceId:lane.sourceId,
      sourceActiveLaneId:state.activeLaneId,sourceActiveDepth:state.activeDepth,
      pointerSequence:state.pointer.sequence,generation:state.generation
    };
    devLog('handoff-candidate',{laneId:lane.id,targetDepth,itemId:hit.itemId,penetration:Math.round(penetration),pointerSequence:candidate.pointerSequence});
    state.handoffTimer=setTimeout(()=>{
      if(state.handoffCandidate!==candidate) return;
      const nowHit=hitInfo();
      const nowLane=state.lanes.get(targetDepth);
      const nowRect=nowLane?.windowEl?.getBoundingClientRect();
      const nowPenetration=nowRect && targetDepth>state.activeDepth ? state.pointer.x-nowRect.left : nowRect ? nowRect.right-state.pointer.x : -Infinity;
      const valid=state.generation===candidate.generation && state.cameraState==='settled' &&
        state.activeDepth===candidate.sourceActiveDepth && state.activeLaneId===candidate.sourceActiveLaneId &&
        nowLane?.id===candidate.laneId && nowLane?.parentId===candidate.parentId && nowLane?.sourceId===candidate.sourceId &&
        nowHit?.laneId===candidate.laneId && nowHit?.itemId===candidate.itemId && nowPenetration>=tune.laneEnterThreshold;
      if(valid) beginHandoff(targetDepth,candidate);
      else cancelHandoffCandidate('commit-revalidation');
    },tune.handoffDelay);
  }

  function hitInfo(x=state.pointer.x,y=state.pointer.y) {
    const el=document.elementFromPoint(x,y);
    const item=el&&el.closest?.('.item');
    const inspection=el&&el.closest?.('.inspection');
    const laneEl=el&&el.closest?.('.lane');
    if(!laneEl) return null;
    return {
      laneId:laneEl.dataset.laneId,
      depth:Number(laneEl.dataset.depth),
      itemId:item?.dataset.itemId||null,
      inspectionOwner:inspection?.dataset.inspectOwner||null,
      role:laneEl.dataset.role
    };
  }

  function onPointerMove(event) {
    const now=performance.now();
    if(!state.pointer.seen) {
      Object.assign(state.pointer,{x:event.clientX,y:event.clientY,lastX:event.clientX,lastY:event.clientY,time:now,velocity:0,seen:true});
      devLog('pointer-anchor',{x:Math.round(event.clientX),y:Math.round(event.clientY)});
      return;
    }
    const dt=Math.max(8,now-state.pointer.time);
    const dx=event.clientX-state.pointer.x;
    const dy=event.clientY-state.pointer.y;
    const speed=Math.hypot(dx,dy)/dt*1000;
    state.pointer.lastX=state.pointer.x;
    state.pointer.lastY=state.pointer.y;
    state.pointer.x=event.clientX;
    state.pointer.y=event.clientY;
    state.pointer.time=now;
    state.pointer.velocity=state.pointer.velocity*.72+speed*.28;
    if(dx===0 && dy===0) {
      devLog('pointer-zero-delta',{camera:state.cameraState});
      return;
    }
    state.pointer.sequence++;
    devLog('pointer-input',{inputSequence:state.pointer.sequence,dx:Math.round(dx*100)/100,dy:Math.round(dy*100)/100,camera:state.cameraState});

    const hit=hitInfo();
    state.insideRevealed=!!(hit&&hit.depth===state.activeDepth+1);
    state.insideActive=!!(hit&&hit.depth===state.activeDepth);

    if(state.cameraState!=='settled') {
      // User deltas continue to the committed lane; camera-generated hit changes do not retarget them.
      const lane=state.lanes.get(state.activeDepth);
      if(lane && dy) feedVertical(lane,dy,'pointer-during-camera');
      return;
    }

    considerHandoff(hit);
    if(!hit || hit.depth!==state.activeDepth) {
      releasePointerLane('outside-active-lane');
      if(state.inspectTargetId) clearInspection({keepReveal:!!(hit&&hit.depth===state.activeDepth+1)});
      return;
    }

    const lane=state.lanes.get(state.activeDepth);
    if(!lane) return;
    if(state.pointer.inputLaneId!==lane.id) {
      releasePointerLane('active-lane-change');
      state.pointer.inputLaneId=lane.id;
      devLog('pointer-lane-enter',{laneId:lane.id,inputSequence:state.pointer.sequence});
      if(hit.itemId && !lane.busy) scheduleInspect(hit.itemId,lane.depth);
      return;
    }
    if(hit.inspectionOwner && hit.inspectionOwner===state.inspectTargetId) return;
    if(Math.hypot(dx,dy)>tune.inspectTolerance || state.pointer.velocity>85) {
      if(state.inspectTargetId) clearInspection({keepReveal:false});
      cancelInspectCandidate('pointer-motion');
    }
    if(dy) feedVertical(lane,dy,'pointer');
    if(hit.itemId && !lane.busy) scheduleInspect(hit.itemId,lane.depth);
  }

  function feedVertical(lane,dy,cause='pointer') {
    if(lane.depth!==state.activeDepth) return;
    lane.accumulator+=dy*tune.verticalGain;
    const pitch=rowPitch();
    const dead=tune.pointerDeadZone*tune.verticalGain;
    const effective=()=>effectiveVerticalMotion(lane.accumulator,dead);
    lane.visualTarget=clamp(-effective()*.22,-pitch*tune.overscroll,pitch*tune.overscroll);
    ensureFlowAnimation();
    let motion=effective();
    while(motion>=pitch) { lane.accumulator-=pitch; enqueueStep(lane,1,cause); motion=effective(); }
    while(motion<=-pitch) { lane.accumulator+=pitch; enqueueStep(lane,-1,cause); motion=effective(); }
  }

  function ensureFlowAnimation() {
    if(state.raf) return;
    const tick=()=>{
      let moving=false;
      for(const lane of state.lanes.values()) {
        const delta=lane.visualTarget-lane.visualOffset;
        lane.visualOffset+=delta*.21;
        if(Math.abs(delta)>.08) moving=true;
        if(lane.rowsEl) lane.rowsEl.style.setProperty('--flow-y',`${lane.visualOffset.toFixed(2)}px`);
      }
      if(moving) state.raf=requestAnimationFrame(tick);
      else state.raf=null;
    };
    state.raf=requestAnimationFrame(tick);
  }

  function enqueueStep(lane,direction,cause='pointer') {
    const count=Math.min(tune.visibleItems,lane.items.length);
    const maxStart=Math.max(0,lane.items.length-count);
    const previousTarget=lane.targetStart;
    lane.targetStart=coalescedExposureTarget(lane.targetStart,direction,maxStart);
    devLog('exposure-request',{laneId:lane.id,direction,cause,start:lane.start,previousTarget,target:lane.targetStart,pending:Math.abs(lane.targetStart-lane.start)});
    if(lane.targetStart===previousTarget) {
      lane.accumulator=Math.sign(lane.accumulator)*tune.pointerDeadZone*tune.verticalGain;
      if(lane.targetStart===lane.start) {
        lane.visualTarget=clamp(-Math.sign(direction)*rowPitch()*tune.overscroll,-16,16);
        ensureFlowAnimation();
        setTimeout(()=>{ if(isLiveLane(lane) && lane.targetStart===lane.start) { lane.visualTarget=0; ensureFlowAnimation(); } },70);
      }
      return;
    }
    if(!lane.busy) processStepQueue(lane);
  }

  async function processStepQueue(lane) {
    lane.busy=true;
    const generation=state.generation;
    while(isLiveLane(lane) && generation===state.generation && lane.start!==lane.targetStart) {
      const direction=Math.sign(lane.targetStart-lane.start);
      const completed=await animateExposureStep(lane,direction,generation);
      if(!completed) break;
    }
    if(!isLiveLane(lane) || generation!==state.generation) return;
    lane.busy=false;
    lane.visualTarget=0;
    lane.visualOffset=0;
    if(lane.rowsEl) lane.rowsEl.style.setProperty('--flow-y','0px');
    devLog('exposure-settled',{laneId:lane.id,start:lane.start,target:lane.targetStart,pending:0});
  }

  async function animateExposureStep(lane,direction,generation) {
    const count=Math.min(tune.visibleItems,lane.items.length);
    const maxStart=Math.max(0,lane.items.length-count);
    const next=clamp(lane.start+direction,0,maxStart);
    if(next===lane.start) return true;
    const transitionGeneration=++lane.transitionGeneration;
    state.transitionGeneration++;
    devLog('exposure-start',{laneId:lane.id,direction,start:lane.start,target:lane.targetStart,transitionGeneration});
    clearInspection({keepReveal:false});
    const oldRows=$$('.item',lane.rowsEl);
    const outgoing=direction>0?oldRows[0]:oldRows[oldRows.length-1];
    const ghost=outgoing?.cloneNode(true);
    if(ghost) {
      ghost.classList.add('outgoing');
      ghost.style.top=outgoing.style.top;
      lane.windowEl.appendChild(ghost);
      const ghostAnimation=ghost.animate([
        {transform:'translate3d(0,0,0)',opacity:1},
        {transform:`translate3d(${-tune.leftExitDistance}px,${direction>0?-10:10}px,0)`,opacity:.3}
      ],{duration:tune.exposureDuration,easing:'cubic-bezier(.24,.7,.25,1)',fill:'forwards'});
      lane.animations.add(ghostAnimation);
      ghostAnimation.finished.catch(()=>{}).finally(()=>lane.animations.delete(ghostAnimation));
    }
    lane.start=next;
    lane.visualOffset=0;
    lane.visualTarget=0;
    renderRows(lane,{force:true});
    const rows=$$('.item',lane.rowsEl);
    const pitch=rowPitch();
    const animations=[];
    rows.forEach((row,slot)=>{
      const isEntering=direction>0?slot===rows.length-1:slot===0;
      const from=isEntering
        ? `translate3d(${-tune.leftEntryDistance}px,${direction>0?8:-8}px,0)`
        : `translate3d(0,${direction>0?pitch:-pitch}px,0)`;
      const animation=row.animate([
        {transform:from,opacity:isEntering ? .55 : 1},
        {transform:'translate3d(0,0,0)',opacity:1}
      ],{duration:tune.exposureDuration,easing:'cubic-bezier(.22,.72,.24,1)'});
      lane.animations.add(animation);
      animations.push(animation.finished.catch(()=>{}).finally(()=>lane.animations.delete(animation)));
    });
    await Promise.all(animations);
    if(!isLiveLane(lane) || state.generation!==generation || lane.transitionGeneration!==transitionGeneration) {
      ghost?.remove();
      return false;
    }
    ghost?.remove();
    devLog('exposure-step',{laneId:lane.id,start:lane.start,target:lane.targetStart,transitionGeneration});
    return true;
  }

  function rowPitch() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pitch'))||46; }

  function bindEvents() {
    document.addEventListener('pointermove',onPointerMove,{passive:true});
    document.addEventListener('pointerdown',event=>{
      const action=event.target.closest?.('.inspect-action');
      if(action) {
        event.preventDefault();
        const owner=action.closest('.inspection')?.dataset.inspectOwner||null;
        const laneEl=action.closest('.lane');
        act(action.dataset.action,owner,{
          laneId:laneEl?.dataset.laneId||null,
          depth:laneEl?Number(laneEl.dataset.depth):null,
          parentId:laneEl?state.lanes.get(Number(laneEl.dataset.depth))?.parentId:null
        });
      }
    });
    document.addEventListener('pointerleave',()=>{
      state.pointer.seen=false;
      releasePointerLane('pointer-leave');
      state.insideActive=false;
      state.insideRevealed=false;
      cancelHandoffCandidate('pointer-leave');
      clearInspection({keepReveal:false});
    });
    window.addEventListener('resize',handleResize);
    $('#dev-toggle').addEventListener('click',()=>{
      const open=$('#dev-panel').classList.toggle('open');
      $('#dev-toggle').setAttribute('aria-expanded',String(open));
    });
    $('#reset').addEventListener('click',reset);
    $('#debug-toggle').addEventListener('click',()=>{
      state.debug=!state.debug;
      $('#debug').classList.toggle('open',state.debug);
      $('#debug-toggle').classList.toggle('active',state.debug);
    });
  }

  function act(action,itemId,authoredContext={}) {
    if(!itemId || !byId.has(itemId)) return;
    const operation=action==='+'?'Create Here':action;
    state.lastAction={action,operation,itemId,authoredContext,at:performance.now()};
    devLog('action',{action,operation,actionTargetId:itemId,...authoredContext});
    feedback.textContent=`${operation} on ${byId.get(itemId)?.text||itemId} — presentation hook only`;
    feedback.classList.add('show');
    setTimeout(()=>feedback.classList.remove('show'),1050);
  }

  function showPhase(label) {
    phaseChip.textContent=label;
    phaseChip.classList.add('show');
    setTimeout(()=>{ if(phaseChip.textContent===label) phaseChip.classList.remove('show'); },420);
  }

  function handleResize() {
    state.generation++;
    cancelInspectCandidate('resize');
    cancelHandoffCandidate('resize');
    clearTimeout(state.closeTimer);
    state.closeTimer=null;
    for(const lane of state.lanes.values()) cancelLaneAnimations(lane,'resize');
    state.phase='IDLE';
    state.cameraState='settled';
    state.protectedItemId=null;
    syncCamera(true);
    devLog('resize',{width:innerWidth,height:innerHeight});
  }

  function reset() {
    state.generation++;
    cancelInspectCandidate('reset'); cancelHandoffCandidate('reset'); clearTimeout(state.closeTimer);
    state.closeTimer=null;
    for(const lane of state.lanes.values()) { cancelLaneAnimations(lane,'reset'); lane.el?.remove(); }
    state.lanes.clear();
    state.retainedContexts.clear();
    Object.assign(state,{
      activeDepth:0,activeLaneId:'lane-0',inspectTargetId:null,inspectLaneDepth:null,
      inspectCandidateId:null,inspectCandidate:null,revealedLaneId:null,handoffTargetLaneId:null,handoffCandidate:null,phase:'IDLE',
      cameraState:'settled',insideActive:false,insideRevealed:false,protectedItemId:null,lastAction:null
    });
    Object.assign(state.pointer,{seen:false,velocity:0,sequence:0,inputLaneId:null});
    state.lanes.set(0,makeLane(0,'root'));
    tune={...defaults};
    buildTuningPanel();
    syncCamera(true);
  }

  const controls=[
    ['inspect delay','inspectDelay',80,1200,10],
    ['inspect tolerance','inspectTolerance',1,16,1],
    ['vertical pointer gain','verticalGain',.2,2,.02],
    ['exposure duration','exposureDuration',60,700,10],
    ['left exit distance','leftExitDistance',30,320,5],
    ['left entry distance','leftEntryDistance',30,260,5],
    ['reveal animation offset','revealOffset',0,100,2],
    ['lane enter threshold','laneEnterThreshold',0,130,2],
    ['handoff delay','handoffDelay',0,700,10],
    ['recenter duration','recenterDuration',80,1000,10],
    ['active lane home %','homePosition',30,58,.5],
    ['depth close grace','depthCloseGrace',0,1500,10]
  ];
  function buildTuningPanel() {
    const grid=$('#dev-grid');
    grid.innerHTML=controls.map(([label,key,min,max,step])=>`<label for="t-${key}">${label}</label><input id="t-${key}" data-key="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${tune[key]}">`).join('');
    $$('input',grid).forEach(input=>input.addEventListener('change',()=>{
      const key=input.dataset.key;
      tune[key]=clamp(Number(input.value),Number(input.min),Number(input.max));
      input.value=tune[key];
      syncCamera();
    }));
  }

  function debugSnapshot() {
    const active=state.lanes.get(state.activeDepth);
    return {
      pointerX:Math.round(state.pointer.x),pointerY:Math.round(state.pointer.y),
      inputSequence:state.pointer.sequence,
      inputLaneId:state.pointer.inputLaneId,
      pointerVelocity:Math.round(state.pointer.velocity),
      activeLaneDepth:state.activeDepth,activeLaneId:state.activeLaneId,
      inspectTargetId:state.inspectTargetId,revealedLaneId:state.revealedLaneId,
      handoffTargetLaneId:state.handoffTargetLaneId,
      handoffCandidate:state.handoffCandidate?`${state.handoffCandidate.laneId}/${state.handoffCandidate.itemId||'-'}`:null,
      inspectCandidate:state.inspectCandidate?.itemId||null,
      phase:state.phase,camera:state.cameraState,
      transitionGeneration:state.transitionGeneration,
      interactionGeneration:state.generation,
      fixture:fixtureName,
      currentLaneHomeX:`${tune.homePosition}%`,
      pointerInsideActiveLane:state.insideActive,
      pointerInsideRevealedLane:state.insideRevealed,
      protectedItemId:state.protectedItemId,
      activeWindowStart:active?.start??null,
      activeExposureTarget:active?.targetStart??null,
      activePendingSteps:active?Math.abs(active.targetStart-active.start):0,
      visibleLaneDepths:[...state.lanes.keys()].filter(d=>visibleDepths().has(d)),
      activeLaneCount:$$('.lane.is-active').length,
      inspectionOwnerCount:$$('.inspection').length,
      canonicalStorageEvidence:'out of scope: standalone presentation only',
      productTraceEvidence:'out of scope: no Trace sink in prototype',
      editorSemanticsEvidence:'out of scope: no draft/editor implementation',
      lastEvent:state.devEvents.at(-1)?.type||null,
      lastCancellation:[...state.devEvents].reverse().find(event=>event.type.endsWith('-cancel'))?.reason||null,
      lastActionTargetId:state.lastAction?.itemId||null
    };
  }
  function debugTick() {
    if(state.debug) $('#debug').textContent=Object.entries(debugSnapshot()).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(','):v}`).join('\n');
    requestAnimationFrame(debugTick);
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  init();
})();
</script>
</body>
</html>
